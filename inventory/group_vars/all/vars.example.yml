---
admin_user:

# Ansible Connection Defaults
ansible_user: "{{ admin_user }}"
ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# --- Xray Configuration ---
xray_port_tcp:
xray_private_key: "{{ vault_xray_private_key }}"

xray_clients:
  - id: "{{ vault_xray_u_admin }}"
    email: ""
    level: 0

  - id: "{{ vault_xray_u_partner }}"
    email: ""
    level: 0
