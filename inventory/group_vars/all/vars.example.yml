---
admin_user:

# Ansible Connection Defaults
ansible_user: "{{ admin_user }}"
# WARNING: The following settings disable SSH host key verification.
# This makes connections vulnerable to man-in-the-middle (MITM) attacks.
# Only use this for ephemeral/test environments or initial bootstrap.
# For production, manage host keys properly via known_hosts or SSH certificates.
ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# --- SSH Keys ---
# Public keys to authorize for the admin user.
# Supports multiple keys for team access or CI/CD.
admin_ssh_keys:
  - "ssh-ed25519 AAAA... you@personal"

# --- Traefik Configuration ---
traefik_acme_email: "admin@yourdomain.com"

# --- Xray Configuration ---
xray_port_tcp: 10000
xray_api_port: 10085
xray_exporter_port: 9550
xray_private_key: "{{ vault_xray_private_key }}"
xray_short_ids: "{{ vault_xray_short_ids }}"
xray_reality_dest: "gateway.icloud.com:443"
xray_reality_server_names:
  - "gateway.icloud.com"

xray_clients:
  - id: "{{ vault_xray_u_admin }}"
    email: ""
    level: 0

  - id: "{{ vault_xray_u_partner }}"
    email: ""
    level: 0
