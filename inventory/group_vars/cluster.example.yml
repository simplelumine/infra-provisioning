---
peer_group: cluster

tailscale_auth_key: ""

# --- Firewall Capabilities ---
firewall_enable_tailscale_trust: true
firewall_enable_cluster_trust: true
firewall_enable_nodeports: true
firewall_enable_ingress: true

# --- K3s Configuration ---
k3s_install_version: "v1.37.0+k3s1"
k3s_etcd_mode: true                       # Use embedded etcd (multi-node HA). Set false for single-node (SQLite).
k3s_etcd_s3_secret: "k3s-etcd-s3-config"  # Optional K8s Secret in kube-system for S3 etcd snapshot backups
k3s_leader_host: "cp-01"                  # First control plane node that initializes the cluster

# --- Xray Configuration ---
xray_port_tcp: 8443
