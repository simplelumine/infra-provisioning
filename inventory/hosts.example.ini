[all:vars]
ansible_user={{ admin_user }}
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[control_plane]
geg-cp-01 ansible_host=1.2.3.4 ansible_ssh_common_args='-o ProxyJump={{ admin_user }}@5.6.7.8'

[worker_nodes]
lax-wk-01 ansible_host=2.3.4.5
lax-wk-02 ansible_host=2.3.4.6

[edge]
lax-eg-01 ansible_host=5.6.7.8
hkg-eg-01 ansible_host=5.6.7.9

[sandbox]
lax-sb-01 ansible_host=3.3.3.3
lax-sb-02 ansible_host=4.4.4.4

[cluster:children]
control_plane
worker_nodes
