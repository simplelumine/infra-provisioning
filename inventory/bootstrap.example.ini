# Bootstrap inventory — used for first-time bare metal setup
# Usage: ansible-playbook bootstrap.yml -i inventory/bootstrap.ini
#
# These hosts are accessed as root with password (VPS provider default).
# After bootstrap completes, switch to cluster.ini (SSH key + admin user).

[all:vars]
ansible_connection=ssh
ansible_user=root
# ansible_ssh_pass='ProviderDefaultPassword'

[all]
# cp-01   ansible_host=1.2.3.4 ansible_ssh_pass='Password123'
# wk-01   ansible_host=2.3.4.5 ansible_ssh_pass='Password456'
