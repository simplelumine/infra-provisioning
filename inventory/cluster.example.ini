# Cluster inventory — used after bootstrap for day-to-day management
# Usage: ansible-playbook site.yml -i inventory/cluster.ini
#
# Uses admin_user + SSH key (configured by bootstrap).
# Nodes are grouped by role; 'cluster' is the parent group for K3s nodes.

[control_plane]
# cp-01  ansible_host=1.2.3.4

[worker_nodes]
# wk-01  ansible_host=2.3.4.5  node_tier=pro
# wk-02  ansible_host=3.4.5.6  node_tier=pro

[cluster:children]
control_plane
worker_nodes

# --- Single-node setup (control plane doubles as worker) ---
# For single-node K3s, put the host in control_plane only.
# K3s server nodes can schedule workloads by default.
#
# [control_plane]
# node-01  ansible_host=1.2.3.4
#
# [worker_nodes]
# (empty)
