---
# Firewall Defaults

# Enable/Disable features (auto-derived from role flags by default)
firewall_enable_ingress: true
firewall_enable_tailscale_trust: "{{ tailscale_enabled | default(false) }}"
firewall_enable_cluster_trust: "{{ wireguard_enabled | default(false) }}"
firewall_enable_nodeports: false

# WireGuard settings
wireguard_interface: wg0
wireguard_port: 51820

# Tailscale & DERP
tailscale_peer_relay_port: 41641
tailscale_derp_enabled: false
tailscale_derp_stun_port: 3478
