---
- name: Ensure iptables directory exists
  file:
    path: /etc/iptables
    state: directory
    mode: '0755'


# 1. Deploy deterministic static firewall templates for boot persistence
- name: Deploy static IPv4 firewall rules template
  template:
    src: rules.v4.j2
    dest: /etc/iptables/rules.v4
    mode: '0600'

- name: Deploy static IPv6 firewall rules template
  template:
    src: rules.v6.j2
    dest: /etc/iptables/rules.v6
    mode: '0600'

# 2. Setup Chains & Policies for current running kernel
- import_tasks: setup.yml

# 4. Cluster Rules (K8s, WireGuard, NodePorts, Node-to-node whitelists)
- include_tasks: cluster.yml

# 5. App Rules
- import_tasks: ingress.yml

# 6. Tailscale Rules
- import_tasks: tailscale.yml

# 7. DERP Rules
- import_tasks: derp.yml

# 8. Final Drop Rule
- name: Drop at end of ANSIBLE-FW
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    jump: DROP
    action: append
    ip_version: ipv4

- name: Drop at end of ANSIBLE-FW6
  ansible.builtin.iptables:
    chain: ANSIBLE-FW6
    jump: DROP
    action: append
    ip_version: ipv6

# 9. Deploy systemd oneshot service for boot persistence
- name: Deploy systemd oneshot service for firewall persistence
  copy:
    dest: /etc/systemd/system/ansible-firewall.service
    content: |
      [Unit]
      Description=Restore ANSIBLE-FW Host Firewall Rules
      Before=network-pre.target
      Wants=network-pre.target
      DefaultDependencies=no

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c '[ -f /etc/iptables/rules.v4 ] && /sbin/iptables-restore /etc/iptables/rules.v4 || true; [ -f /etc/iptables/rules.v6 ] && /sbin/ip6tables-restore /etc/iptables/rules.v6 || true'
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    mode: '0644'

- name: Enable ansible-firewall systemd service
  systemd:
    name: ansible-firewall
    enabled: true
    daemon_reload: true
