---
- name: Install iptables-persistent
  apt:
    name:
      - iptables-persistent
      - netfilter-persistent
    state: present

# 1. Setup Chains & Policies
- import_tasks: setup.yml

# 2. Base Rules (SSH, ICMP, Loopback)
- import_tasks: base.yml

# 3. Cluster Rules (K8s, Cilium, NodePorts)
- include_tasks: cluster.yml

# 4. App Rules
- import_tasks: ingress.yml
- import_tasks: xray.yml

# 5. Tailscale Rules
- import_tasks: tailscale.yml

# 6. Final Drop Rule
- name: Log and Drop at end of ANSIBLE-FW
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    jump: DROP
    action: append
    ip_version: ipv4
  notify: Save Firewall Rules

- name: Log and Drop at end of ANSIBLE-FW6
  ansible.builtin.iptables:
    chain: ANSIBLE-FW6
    jump: DROP
    action: append
    ip_version: ipv6
  notify: Save IPv6 Firewall Rules

# 7. Save rules to disk immediately
- meta: flush_handlers

- name: Enable netfilter-persistent
  service:
    name: netfilter-persistent
    state: started
    enabled: true
