---
- name: Allow Tailscale DERP STUN
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    protocol: udp
    destination_port: "{{ tailscale_derp_stun_port | default(3478) }}"
    jump: ACCEPT
    action: append
    ip_version: ipv4
  when: tailscale_derp_enabled | default(false) | bool
  notify: Save Firewall Rules

- name: Allow Tailscale DERP STUN (IPv6)
  ansible.builtin.iptables:
    chain: ANSIBLE-FW6
    protocol: udp
    destination_port: "{{ tailscale_derp_stun_port | default(3478) }}"
    jump: ACCEPT
    action: append
    ip_version: ipv6
  when: tailscale_derp_enabled | default(false) | bool
  notify: Save IPv6 Firewall Rules

- name: Allow Coder DERP STUN
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    protocol: udp
    destination_port: "{{ cde_derp_stun_port | default(3479) }}"
    jump: ACCEPT
    action: append
    ip_version: ipv4
  when: cde_derp_enabled | default(false) | bool
  notify: Save Firewall Rules

- name: Allow Coder DERP STUN (IPv6)
  ansible.builtin.iptables:
    chain: ANSIBLE-FW6
    protocol: udp
    destination_port: "{{ cde_derp_stun_port | default(3479) }}"
    jump: ACCEPT
    action: append
    ip_version: ipv6
  when: cde_derp_enabled | default(false) | bool
  notify: Save IPv6 Firewall Rules
