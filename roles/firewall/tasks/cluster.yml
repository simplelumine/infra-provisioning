---
- name: Allow standard Kubernetes TCP ports
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    protocol: tcp
    destination_port: "{{ item }}"
    jump: ACCEPT
    action: append
    ip_version: ipv4
  loop: "{{ firewall_allowed_tcp_ports }}"
  when: firewall_enable_cluster_trust | bool

- name: Allow standard Kubernetes TCP ports (IPv6)
  ansible.builtin.iptables:
    chain: ANSIBLE-FW6
    protocol: tcp
    destination_port: "{{ item }}"
    jump: ACCEPT
    action: append
    ip_version: ipv6
  loop: "{{ firewall_allowed_tcp_ports }}"
  when: firewall_enable_cluster_trust | bool

- name: Allow standard Kubernetes UDP ports
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    protocol: udp
    destination_port: "{{ item }}"
    jump: ACCEPT
    action: append
    ip_version: ipv4
  loop: "{{ firewall_allowed_udp_ports }}"
  when: firewall_enable_cluster_trust | bool

- name: Allow standard Kubernetes UDP ports (IPv6)
  ansible.builtin.iptables:
    chain: ANSIBLE-FW6
    protocol: udp
    destination_port: "{{ item }}"
    jump: ACCEPT
    action: append
    ip_version: ipv6
  loop: "{{ firewall_allowed_udp_ports }}"
  when: firewall_enable_cluster_trust | bool

- name: Allow all traffic on Flannel WireGuard interface
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    in_interface: flannel-wg
    jump: ACCEPT
    action: append
    ip_version: ipv4
  when: firewall_enable_cluster_trust | bool


- name: Allow all traffic on CNI bridge interface
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    in_interface: cni0
    jump: ACCEPT
    action: append
    ip_version: ipv4
  when: firewall_enable_cluster_trust | bool

- name: Allow Pod CIDR
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    source: 10.42.0.0/16
    jump: ACCEPT
    action: append
    ip_version: ipv4
  when: firewall_enable_cluster_trust | bool

- name: Allow Service CIDR
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    source: 10.43.0.0/16
    jump: ACCEPT
    action: append
    ip_version: ipv4
  when: firewall_enable_cluster_trust | bool

- name: Allow NodePorts (TCP)
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    protocol: tcp
    destination_port: 30000:32767
    jump: ACCEPT
    action: append
    ip_version: ipv4
  when: firewall_enable_nodeports | bool

- name: Allow NodePorts (UDP)
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    protocol: udp
    destination_port: 30000:32767
    jump: ACCEPT
    action: append
    ip_version: ipv4
  when: firewall_enable_nodeports | bool

- name: Allow cluster internal TCP ports (Kubelet, Node Exporter) from cluster nodes
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    protocol: tcp
    destination_ports: "{{ firewall_cluster_internal_tcp_ports }}"
    source: "{{ hostvars[item].ansible_host }}"
    jump: ACCEPT
    action: append
    ip_version: ipv4
  loop: "{{ groups['cluster'] }}"
  when: 
    - firewall_enable_cluster_trust | bool
    - hostvars[item].ansible_host is defined
