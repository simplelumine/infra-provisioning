---
- name: Allow Tailscale Trust Zone
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    in_interface: tailscale0
    jump: ACCEPT
    action: append
    ip_version: ipv4
  when: firewall_enable_tailscale_trust | bool

- name: Allow Tailscale WireGuard/Peer Relay UDP port
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    protocol: udp
    destination_port: "{{ tailscale_peer_relay_port | default(41641) }}"
    jump: ACCEPT
    action: append
    ip_version: ipv4
  when: firewall_enable_tailscale_trust | bool

- name: Allow Tailscale Trust Zone (IPv6)
  ansible.builtin.iptables:
    chain: ANSIBLE-FW6
    in_interface: tailscale0
    jump: ACCEPT
    action: append
    ip_version: ipv6
  when: firewall_enable_tailscale_trust | bool

- name: Allow Tailscale WireGuard/Peer Relay UDP port (IPv6)
  ansible.builtin.iptables:
    chain: ANSIBLE-FW6
    protocol: udp
    destination_port: "{{ tailscale_peer_relay_port | default(41641) }}"
    jump: ACCEPT
    action: append
    ip_version: ipv6
  when: firewall_enable_tailscale_trust | bool
