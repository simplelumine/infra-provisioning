# IPv4 Chain Setup - Safe Idempotent Configuration
# Manage ANSIBLE-FW custom chain without flushing the system INPUT chain (which K3s depends on).

# 1. Base safety rules on INPUT (connection tracking, loopback, SSH)
- name: Allow established connections on INPUT
  ansible.builtin.iptables:
    chain: INPUT
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT
    action: append
    ip_version: ipv4

- name: Allow loopback traffic on INPUT
  ansible.builtin.iptables:
    chain: INPUT
    in_interface: lo
    jump: ACCEPT
    action: append
    ip_version: ipv4

- name: Allow SSH on INPUT
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 22
    jump: ACCEPT
    action: append
    ip_version: ipv4

# 2. Manage Custom Chain (ANSIBLE-FW)
- name: Create ANSIBLE-FW chain
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    chain_management: true
    state: present
    ip_version: ipv4

- name: Flush ANSIBLE-FW chain
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    flush: true
    ip_version: ipv4

- name: Allow ICMP on ANSIBLE-FW
  ansible.builtin.iptables:
    chain: ANSIBLE-FW
    protocol: icmp
    jump: ACCEPT
    action: append
    ip_version: ipv4

- name: Add INPUT jump to ANSIBLE-FW
  ansible.builtin.iptables:
    chain: INPUT
    jump: ANSIBLE-FW
    action: append
    ip_version: ipv4

# 3. Safe to set DROP policy (ESTABLISHED + lo + SSH + ANSIBLE-FW jump are in place)
- name: Set INPUT chain default policy to DROP
  ansible.builtin.iptables:
    chain: INPUT
    policy: DROP
    ip_version: ipv4

# IPv6 Chain Setup - Safe Idempotent Configuration
