---
- name: Download xray-exporter binary
  get_url:
    url: "https://github.com/free-xray/xray-exporter/releases/download/v{{ xray_exporter_version }}/xray-exporter-linux-amd64"
    dest: /usr/local/bin/xray-exporter
    mode: '0755'
  ignore_errors: true

- name: Deploy xray-exporter systemd service
  copy:
    dest: /etc/systemd/system/xray-exporter.service
    mode: '0644'
    content: |
      [Unit]
      Description=Xray Prometheus Exporter
      After=network.target xray.service
      Wants=xray.service

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/xray-exporter -e 127.0.0.1:{{ xray_api_port }} -l :{{ xray_exporter_port }} --user-traffic-metrics
      Restart=always
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target
  notify: Reload systemd

- name: Ensure xray-exporter service is started and enabled
  service:
    name: xray-exporter
    state: started
    enabled: true
