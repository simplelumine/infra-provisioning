---
- name: Create Xray directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /usr/local/etc/xray
    - /var/lib/xray
    - /etc/systemd/system/xray.service.d
    - "{{ xray_textfile_collector_dir | default('/var/lib/node_exporter/textfile_collector') }}"

- name: Install Xray (first time)
  shell: |
    bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install
  args:
    creates: /usr/local/bin/xray

- name: Update Xray to latest version
  shell: |
    bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install
  register: xray_update_result
  changed_when: "'installed' in xray_update_result.stdout or 'upgraded' in xray_update_result.stdout"
  notify: Restart Xray

- name: Deploy Xray auto-update systemd service
  copy:
    dest: /etc/systemd/system/xray-update.service
    mode: '0644'
    content: |
      [Unit]
      Description=Xray Auto Update
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/bin/bash -c '"$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install'
      ExecStartPost=/bin/systemctl restart xray
  notify: Reload systemd

- name: Deploy Xray auto-update systemd timer
  copy:
    dest: /etc/systemd/system/xray-update.timer
    mode: '0644'
    content: |
      [Unit]
      Description=Weekly Xray Auto Update

      [Timer]
      OnCalendar=weekly
      RandomizedDelaySec=3600
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Deploy Xray traffic accounting script
  copy:
    src: xray-accounting.py
    dest: /usr/local/bin/xray-accounting.py
    mode: '0755'
  when: xray_enable_accounting | default(true) | bool
  notify: Run Xray accounting

- name: Render Xray accounting configuration
  template:
    src: xray_accounting.json.j2
    dest: /usr/local/etc/xray/accounting.json
    mode: '0644'
  when: xray_enable_accounting | default(true) | bool
  notify: Run Xray accounting

- name: Deploy Xray service drop-in for immediate post-start quota enforcement
  copy:
    dest: /etc/systemd/system/xray.service.d/accounting.conf
    mode: '0644'
    content: |
      [Service]
      ExecStartPost=+-/usr/local/bin/xray-accounting.py --wait-api
  when: xray_enable_accounting | default(true) | bool
  notify: Reload systemd

- name: Deploy Xray accounting systemd service
  copy:
    dest: /etc/systemd/system/xray-accounting.service
    mode: '0644'
    content: |
      [Unit]
      Description=Xray Traffic Accounting and Quota Enforcement
      After=xray.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/xray-accounting.py
  when: xray_enable_accounting | default(true) | bool
  notify: Reload systemd

- name: Deploy Xray accounting systemd timer
  copy:
    dest: /etc/systemd/system/xray-accounting.timer
    mode: '0644'
    content: |
      [Unit]
      Description=Run Xray Traffic Accounting Every Minute

      [Timer]
      OnCalendar=*:0/1
      AccuracySec=5s
      Persistent=true

      [Install]
      WantedBy=timers.target
  when: xray_enable_accounting | default(true) | bool
  notify: Reload systemd

- name: Render Xray configuration
  template:
    src: xray_config.json.j2
    dest: /usr/local/etc/xray/config.json
    mode: '0644'
    validate: '/bin/sh -c "/usr/local/bin/xray run -test -config stdin: < %s"'
  notify: Restart Xray

- name: Force immediate handler execution
  meta: flush_handlers

- name: Ensure Xray is running
  service:
    name: xray
    state: started
    enabled: true

- name: Enable Xray auto-update timer
  service:
    name: xray-update.timer
    state: started
    enabled: true

- name: Enable Xray accounting timer
  service:
    name: xray-accounting.timer
    state: started
    enabled: true
  when: xray_enable_accounting | default(true) | bool
