---
- name: Enable IPv4 and IPv6 forwarding for Kubernetes
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-k8s.conf
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: "net.ipv4.ip_forward", value: "1" }
    - { name: "net.ipv6.conf.all.forwarding", value: "1" }

- name: Load Kernel Modules
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
    - wireguard

- name: Ensure Kernel Modules load on boot
  copy:
    content: |
      overlay
      br_netfilter
      wireguard
    dest: /etc/modules-load.d/k8s.conf
    mode: '0644'
