---
- name: Enable IPv4 forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Load Kernel Modules
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Ensure Kernel Modules load on boot
  copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/k8s.conf

- name: Mount BPF filesystem
  mount:
    path: /sys/fs/bpf
    src: bpf
    fstype: bpf
    state: mounted

# Populate /etc/hosts with cluster node public IPs
# This ensures K3s nodes communicate via public IP, not Tailscale MagicDNS
- name: Add cluster nodes to /etc/hosts
  blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED - K3S CLUSTER NODES"
    block: |
      {% for host in groups['cluster'] | default([]) %}
      {% if hostvars[host]['ansible_host'] is defined %}
      {{ hostvars[host]['ansible_host'] }} {{ host }}
      {% endif %}
      {% endfor %}
