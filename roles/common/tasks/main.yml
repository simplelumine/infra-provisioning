---
# 1. Hostname & /etc/hosts
- name: Set hostname
  hostname:
    name: "{{ inventory_hostname }}"

- name: Add hostname to /etc/hosts
  lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\b'
    line: "127.0.1.1 {{ inventory_hostname }} {{ inventory_hostname.split('.')[0] }}"
    owner: root
    group: root
    mode: '0644'

- name: Configure unified clean DNS (/etc/resolv.conf)
  copy:
    dest: /etc/resolv.conf
    follow: false
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible (common role)
      {% if ':' in (wg_endpoint | default('')) %}
      nameserver 2606:4700:4700::1111
      nameserver 2001:4860:4860::8888
      {% else %}
      nameserver 1.1.1.1
      nameserver 8.8.8.8
      {% endif %}
      options timeout:2 attempts:2

# 2. Base Packages & Time Sync
- name: Install system dependencies (Common)
  apt:
    name:
      - bash
      - sudo
      - python3
      - curl
      - gnupg
      - ca-certificates
      - iptables
      - htop
      - systemd-timesyncd
      - fail2ban
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true

- name: Enable NTP (systemd-timesyncd)
  service:
    name: systemd-timesyncd
    state: started
    enabled: true

# 3. Security (Fail2Ban & SSH Hardening)
- name: Configure Fail2Ban
  template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: '0644'
  notify: Restart Fail2Ban

- name: Ensure Fail2Ban is running
  service:
    name: fail2ban
    state: started
    enabled: true

- name: Authorize controller SSH public key
  authorized_key:
    user: "{{ ansible_user | default('root') }}"
    state: present
    key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

- name: Harden SSH configuration
  template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

# 4. Unattended Upgrades
- name: Configure unattended-upgrades auto-update
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Configure unattended-upgrades policy
  copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: '0644'
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}";
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
          "origin=*";
      };
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Enable unattended-upgrades service
  service:
    name: unattended-upgrades
    state: started
    enabled: true

- name: Upgrade Linux kernel and system security packages
  apt:
    upgrade: dist
    update_cache: true
    autoremove: true
    autoclean: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: system_upgrade_packages | default(true) | bool
  tags:
    - common
    - upgrade

# 5. Swap Configuration
- import_tasks: swap.yml
