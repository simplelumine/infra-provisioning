---
- name: Update all packages (Force ConfNew)
  apt:
    upgrade: dist
    update_cache: true
    dpkg_options: 'force-confdef,force-confnew'
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: system_upgrade | default(false) | bool

- name: Check if reboot is required
  stat:
    path: /var/run/reboot-required
  register: reboot_required
  when: system_upgrade | default(false) | bool

- name: Reboot server (only if required and upgrades enabled)
  reboot:
    msg: "Rebooting after system upgrade"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: whoami
  when: 
    - system_upgrade | default(false) | bool
    - reboot_required.stat.exists
