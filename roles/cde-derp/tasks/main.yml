---
# Skip entire role if cde-derp is not enabled
- name: Skip CDE DERP role if not enabled
  meta: end_role
  when: not (cde_derp_enabled | default(false))

- name: Create CDE DERP directory
  file:
    path: "{{ cde_derp_dir }}"
    state: directory
    mode: "0755"

- name: Check if Go is installed
  command: /usr/local/go/bin/go version
  register: go_check
  failed_when: false
  changed_when: false

- name: Download Go
  get_url:
    url: https://go.dev/dl/go1.23.4.linux-amd64.tar.gz
    dest: /tmp/go.tar.gz
  when: go_check.rc != 0

- name: Extract Go
  unarchive:
    src: /tmp/go.tar.gz
    dest: /usr/local
    remote_src: yes
  when: go_check.rc != 0

- name: Check if derper exists
  stat:
    path: "{{ cde_derp_dir }}/derper"
  register: cde_derper_stat

# Optimization: Copy from main derp if available
- name: Check if main derp binary exists
  stat:
    path: /opt/derp/derper
  register: main_derper_stat
  when: not cde_derper_stat.stat.exists

- name: Copy derper from main install
  copy:
    src: /opt/derp/derper
    dest: "{{ cde_derp_dir }}/derper"
    remote_src: yes
    mode: "0755"
  when: 
    - not cde_derper_stat.stat.exists 
    - main_derper_stat.stat is defined 
    - main_derper_stat.stat.exists

- name: Build derper using Go (Fallback)
  shell: |
    export PATH=$PATH:/usr/local/go/bin
    export GOPATH={{ cde_derp_dir }}/go
    export GOTMPDIR={{ cde_derp_dir }}/tmp
    mkdir -p {{ cde_derp_dir }}/tmp
    go install tailscale.com/cmd/derper@latest
    cp {{ cde_derp_dir }}/go/bin/derper {{ cde_derp_dir }}/derper
  args:
    creates: "{{ cde_derp_dir }}/derper"
  when: not cde_derper_stat.stat.exists and (main_derper_stat.stat is undefined or not main_derper_stat.stat.exists)
  notify: Restart CDE DERP

- name: Deploy CDE DERP systemd service
  template:
    src: cde-derper.service.j2
    dest: /etc/systemd/system/cde-derper.service
  notify: Restart CDE DERP

- name: Enable and start CDE DERP service
  systemd:
    name: cde-derper
    state: started
    enabled: true
    daemon_reload: true
  when: cde_derp_enabled | default(false)
