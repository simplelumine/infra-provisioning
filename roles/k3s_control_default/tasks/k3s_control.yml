---
- name: Check if Leader Host is Defined
  fail:
    msg: "k3s_leader_host variable must be defined in group_vars"
  when: k3s_leader_host is not defined

- name: Check current K3s version
  command: k3s --version
  register: k3s_current_version
  changed_when: false
  failed_when: false

- name: Retrieve K3s Token from Leader (Followers only)
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: leader_token_raw
  delegate_to: "{{ k3s_leader_host }}"
  run_once: true
  when: inventory_hostname != k3s_leader_host

- name: Set Token Fact (Followers only)
  set_fact:
    k3s_token: "{{ leader_token_raw.content | b64decode | trim }}"
  when: inventory_hostname != k3s_leader_host

- name: Get Tailscale IP (optional)
  command: tailscale ip -4
  register: tailscale_ip_output
  changed_when: false
  failed_when: false

- name: Define K3s Installation Args
  set_fact:
    k3s_mode_args: >-
      {%- if inventory_hostname == k3s_leader_host -%}
        {%- if k3s_etcd_mode | default(false) | bool -%}
          --cluster-init
        {%- endif -%}
      {%- else -%}
        --server https://{{ hostvars[k3s_leader_host]['ansible_host'] }}:6443 --token {{ k3s_token }}
      {%- endif -%}

- name: Define K3s Flannel Args
  set_fact:
    k3s_flannel_args: >-
      {%- if k3s_flannel_wireguard | default(false) | bool -%}
        --flannel-backend=wireguard-native --flannel-external-ip
      {%- endif -%}

- name: Install/Upgrade K3s Server
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_install_version }} sh -s - server \
    {{ k3s_mode_args }} \
    {{ k3s_flannel_args }} \
    --node-external-ip {{ ansible_host }} \
    --disable=traefik \
    --kubelet-arg="fail-swap-on=false" \
    --tls-san {{ ansible_host }} \
    --tls-san {{ inventory_hostname }}{% if tailscale_ip_output.stdout | default('') | trim %} \
    --tls-san {{ tailscale_ip_output.stdout | trim }}{% endif %}

  when: >
    k3s_current_version.rc != 0 or
    k3s_install_version not in k3s_current_version.stdout

- name: Retrieve K3s Kubeconfig (Leader Only)
  slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_base64
  when: inventory_hostname == k3s_leader_host

- name: Create local .kube directory
  delegate_to: localhost
  become: false
  file:
    path: "~/.kube"
    state: directory
    mode: '0755'
  run_once: true

- name: Save Kubeconfig locally (cluster-specific file)
  delegate_to: localhost
  become: false
  copy:
    content: "{{ k3s_kubeconfig_base64.content | b64decode | replace('127.0.0.1', ansible_host) }}"
    dest: "~/.kube/config-{{ k3s_leader_host }}"
    mode: '0600'
  when: inventory_hostname == k3s_leader_host

- name: Show kubeconfig usage hint
  debug:
    msg: >
      Kubeconfig saved to ~/.kube/config-{{ k3s_leader_host }}.
      Use: export KUBECONFIG=~/.kube/config-{{ k3s_leader_host }}
      Or merge: KUBECONFIG=~/.kube/config:~/.kube/config-{{ k3s_leader_host }} kubectl config view --flatten > ~/.kube/config-merged
  run_once: true
  when: inventory_hostname == k3s_leader_host

- name: Label Control Plane Node with Zone (City)
  command: kubectl label node {{ inventory_hostname }} topology.kubernetes.io/zone={{ inventory_hostname[:3] }} --overwrite
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: zone_label_result
  changed_when: "'not labeled' not in zone_label_result.stdout"

- name: Label Control Plane Node with Region
  command: kubectl label node {{ inventory_hostname }} topology.kubernetes.io/region={{ node_region | default('us-west') }} --overwrite
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: region_label_result
  changed_when: "'not labeled' not in region_label_result.stdout"
