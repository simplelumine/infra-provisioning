- name: Apply Base Configuration (Common)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: common

- name: Configure Edge Nodes
  hosts: edge
  become: true
  gather_facts: true
  roles:
    - role: tailscale
      tags: tailscale
    - role: firewall
      tags: firewall
    - role: xray
      tags: xray
    - role: caddy
      tags: caddy
    - role: derp
      tags: derp
    - role: node_exporter
      tags: node_exporter

- name: Configure Control Plane
  hosts: control_plane
  become: true
  gather_facts: true
  roles:
    - role: tailscale
      tags: tailscale
    - role: xray
      tags: xray
    - role: firewall
      tags: firewall
    - role: k8s_prereqs
      tags: k8s_prereqs
    - role: k3s_control_cilium
      tags: k3s_control_cilium
    - role: cilium
      tags: cilium

- name: Configure Worker Nodes
  hosts: worker_nodes
  become: true
  gather_facts: true
  roles:
    - role: tailscale
      tags: tailscale
    - role: xray
      tags: xray
    - role: firewall
      tags: firewall
    - role: k8s_prereqs
      tags: k8s_prereqs
    - role: k3s_worker
      tags: k3s_worker

- name: Configure Sandbox Nodes (Testing Only)
  hosts: sandbox
  become: true
  gather_facts: true
  roles:
    - role: tailscale
      tags: tailscale
    - role: xray
      tags: xray
    - role: firewall
      tags: firewall
