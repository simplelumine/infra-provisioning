- name: Apply Base Configuration (Common)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - common

- name: Configure Edge Nodes
  hosts: edge
  become: true
  gather_facts: true
  roles:
    - tailscale
    - firewall
    - xray
    - caddy
    - derp

- name: Configure Sandbox Nodes (Testing Only)
  hosts: sandbox
  become: true
  gather_facts: true
  roles:
    - tailscale
    - xray
    - firewall

- name: Configure Control Plane
  hosts: control_plane
  become: true
  gather_facts: true
  roles:
    - tailscale
    - xray
    - firewall
    - k8s_prereqs
    - k3s_control
    - cilium

- name: Configure Worker Nodes
  hosts: worker_nodes
  become: true
  gather_facts: true
  roles:
    - tailscale
    - xray
    - firewall
    - k8s_prereqs
    - k3s_worker
