---
- name: Apply Base System Configuration
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: common

- name: Configure Tailscale Mesh
  hosts: tailscale
  become: true
  gather_facts: true
  roles:
    - role: tailscale
      tags: tailscale

- name: Configure Kernel WireGuard Mesh
  hosts: wireguard
  become: true
  gather_facts: true
  roles:
    - role: wireguard
      tags: wireguard

- name: Configure Host Firewall
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: firewall
      tags: firewall

- name: Configure Edge Nodes
  hosts: edge
  become: true
  gather_facts: true
  roles:
    - role: traefik
      tags: traefik
    - role: derp
      tags: derp
    - role: node_exporter
      tags: node_exporter

- name: Configure Xray Service
  hosts: xray
  become: true
  gather_facts: true
  roles:
    - role: xray
      tags: xray

- name: Configure Kubernetes Control Plane
  hosts: control_plane
  become: true
  gather_facts: true
  roles:
    - role: k3s_control
      tags: k3s_control

- name: Configure Kubernetes Worker Nodes
  hosts: worker_nodes
  become: true
  gather_facts: true
  roles:
    - role: k3s_worker
      tags: k3s_worker
