- name: Apply Base Configuration (All Nodes)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: common
    - role: tailscale
      tags: tailscale
    - role: firewall
      tags: firewall

- name: Configure Edge Nodes
  hosts: edge
  become: true
  gather_facts: true
  roles:
    - role: traefik
      tags: traefik
    - role: xray
      tags: xray
    - role: derp
      tags: derp
    - role: node_exporter
      tags: node_exporter

- name: Configure Control Plane
  hosts: control_plane
  become: true
  gather_facts: true
  roles:
    - role: k8s_prereqs
      tags: k8s_prereqs
    - role: k3s_control_default
      tags: k3s_control_default

- name: Configure Worker Nodes
  hosts: worker_nodes
  become: true
  gather_facts: true
  roles:
    - role: k8s_prereqs
      tags: k8s_prereqs
    - role: k3s_worker
      tags: k3s_worker
